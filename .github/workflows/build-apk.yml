name: Build BengalSeva APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Android App & Compile APK
        run: |
          flutter create app_builder --org in.bengalseva --project-name bengalseva --platforms android
          cd app_builder
          flutter pub add webview_flutter permission_handler connectivity_plus

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:connectivity_plus/connectivity_plus.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(
                statusBarColor: Color(0xFF0B2239),
                statusBarIconBrightness: Brightness.light,
                systemNavigationBarColor: Colors.white,
                systemNavigationBarIconBrightness: Brightness.dark,
              ),
            );
            runApp(const BengalSevaApp());
          }

          class BengalSevaApp extends StatelessWidget {
            const BengalSevaApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'BengalSeva',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primaryColor: const Color(0xFF0B2239),
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF0B2239)),
                  useMaterial3: true,
                ),
                home: const AppWebViewScreen(),
              );
            }
          }

          class AppWebViewScreen extends StatefulWidget {
            const AppWebViewScreen({super.key});

            @override
            State<AppWebViewScreen> createState() => _AppWebViewScreenState();
          }

          class _AppWebViewScreenState extends State<AppWebViewScreen> {
            late final WebViewController _controller;
            bool _isLoading = true;
            bool _isOffline = false;
            int _loadingProgress = 0;

            static const String appUrl = "https://searchkaro.midexa.in/app.php";

            @override
            void initState() {
              super.initState();
              _requestAppPermissions();
              _checkConnectivity();
              _initWebViewController();
            }

            Future<void> _requestAppPermissions() async {
              await [
                Permission.location,
                Permission.microphone,
                Permission.camera,
              ].request();
            }

            Future<void> _checkConnectivity() async {
              final connectivityResult = await Connectivity().checkConnectivity();
              if (connectivityResult == ConnectivityResult.none) {
                setState(() => _isOffline = true);
              }
            }

            void _initWebViewController() {
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFFF1F5F9))
                ..setUserAgent("BengalSeva-Android-App/1.0 (Linux; Android)")
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (int progress) {
                      setState(() => _loadingProgress = progress);
                    },
                    onPageStarted: (String url) {
                      setState(() {
                        _isLoading = true;
                        _isOffline = false;
                      });
                    },
                    onPageFinished: (String url) {
                      setState(() => _isLoading = false);
                    },
                    onWebResourceError: (WebResourceError error) {
                      if (error.isForMainFrame ?? true) {
                        setState(() {
                          _isOffline = true;
                          _isLoading = false;
                        });
                      }
                    },
                  ),
                )
                ..loadRequest(Uri.parse(appUrl));
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (bool didPop, dynamic result) async {
                  if (didPop) return;
                  if (await _controller.canGoBack()) {
                    await _controller.goBack();
                  } else {
                    if (context.mounted) {
                      _showExitDialog(context);
                    }
                  }
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF0B2239),
                  body: SafeArea(
                    child: _isOffline ? _buildOfflineWidget() : _buildWebViewWidget(),
                  ),
                ),
              );
            }

            Widget _buildWebViewWidget() {
              return Stack(
                children: [
                  RefreshIndicator(
                    color: const Color(0xFFFF6A00),
                    backgroundColor: Colors.white,
                    onRefresh: () async {
                      await _controller.reload();
                    },
                    child: WebViewWidget(controller: _controller),
                  ),
                  if (_isLoading)
                    LinearProgressIndicator(
                      value: _loadingProgress / 100.0,
                      color: const Color(0xFFFF6A00),
                      backgroundColor: const Color(0xFF0B2239),
                      minHeight: 3,
                    ),
                ],
              );
            }

            Widget _buildOfflineWidget() {
              return Container(
                color: Colors.white,
                padding: const EdgeInsets.all(32),
                width: double.infinity,
                child: Column(
                  mainAxisAlignment: MainAxisAlignment.center,
                  children: [
                    const Icon(Icons.wifi_off_rounded, size: 80, color: Color(0xFFFF6A00)),
                    const SizedBox(height: 20),
                    const Text("No Internet Connection", style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Color(0xFF0B2239))),
                    const SizedBox(height: 10),
                    const Text("Please check your mobile data or Wi-Fi to continue using BengalSeva.", textAlign: TextAlign.center, style: TextStyle(color: Colors.grey, fontSize: 14)),
                    const SizedBox(height: 30),
                    ElevatedButton.icon(
                      onPressed: () {
                        setState(() { _isOffline = false; _isLoading = true; });
                        _controller.loadRequest(Uri.parse(appUrl));
                      },
                      icon: const Icon(Icons.refresh_rounded, color: Colors.white),
                      label: const Text("Retry Connection", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                      style: ElevatedButton.styleFrom(
                        backgroundColor: const Color(0xFF0B2239),
                        padding: const EdgeInsets.symmetric(horizontal: 32, vertical: 14),
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      ),
                    ),
                  ],
                ),
              );
            }

            void _showExitDialog(BuildContext context) {
              showDialog(
                context: context,
                builder: (context) => AlertDialog(
                  title: const Text("Exit BengalSeva?"),
                  content: const Text("Do you really want to close the app?"),
                  actions: [
                    TextButton(onPressed: () => Navigator.of(context).pop(), child: const Text("Cancel")),
                    TextButton(onPressed: () { Navigator.of(context).pop(); SystemNavigator.pop(); }, child: const Text("Exit", style: TextStyle(color: Colors.red))),
                  ],
                ),
              );
            }
          }
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="in.bengalseva.app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application
                  android:label="BengalSeva"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/NormalTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          flutter build apk --release --no-tree-shake-icons

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: BengalSeva-Release-APK
          path: app_builder/build/app/outputs/flutter-apk/app-release.apk
